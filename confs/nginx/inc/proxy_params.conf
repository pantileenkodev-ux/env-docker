#
# Параметры FastCGI для работы за реверс-прокси (Traefik).
# Подключается ПОСЛЕ "include fastcgi_params;" - переопределяет схему, порт и HTTPS.
# Значения берутся из карт /etc/nginx/maps/proxy_scheme.conf.
#
fastcgi_param HTTPS          $bx_https if_not_empty;
fastcgi_param REQUEST_SCHEME $bx_scheme;
fastcgi_param SERVER_PORT    $bx_server_port;
