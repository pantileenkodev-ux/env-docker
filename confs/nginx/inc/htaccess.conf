#
# Правила из www/.htaccess, перенесенные в nginx.
# Подключается на уровне server {} в conf.d/default.conf, ДО остальных include.
# Статические редиректы (бывшие "Redirect 301") - в /etc/nginx/maps/htaccess_redirects.conf.
#
# Порядок проверок:
#   1. блокировка IP
#   2. www/https -> https://turkov.ru (только прод, по умолчанию выключено)
#   3. точные редиректы из карты (бывшие "Redirect 301")
#   4. /index.php -> /
#   5. редиректы по шаблону (бывшие "RewriteRule ... [R=301]")
#   6. добавление завершающего слеша
#   Роутинг Bitrix (всё несуществующее -> /bitrix/urlrewrite.php) уже есть в default.conf:
#   try_files $uri $uri/ @bitrix.
#
# Не переносилось (в nginx не нужно или уже настроено):
#   Options -Indexes        - autoindex в nginx выключен по умолчанию
#   ErrorDocument 404       - 404 обрабатывает Bitrix (error_page 404 @bitrix -> urlrewrite.php -> 404.php)
#   DirectoryIndex          - index index.php в default.conf
#   php_flag / php_value    - настраивается в PHP (confs/php82/etc/php/conf.d/), а не в nginx
#   Header Alt-Svc          - nginx без HTTP/3 не отдает Alt-Svc; если отдает Traefik - отключать в нем
#   ExpiresByType jpeg/gif  - кэширование статики задано в inc/static.conf (expires 30d)
#   E=REMOTE_USER           - php-fpm сам получает заголовок Authorization (HTTP_AUTHORIZATION)
#

# Все редиректы отдаются относительными (Location: /path/): одинаково работают на любом
# домене (dev, прод) и за Traefik не превращаются в http://host:80/...
absolute_redirect off;

# --- 1. Блокировка IP ($remote_addr - реальный IP клиента, см. inc/real_ip.conf) ---
if ($remote_addr = 5.180.180.141) {
    return 403;
}

# --- 2. Склейка www -> без www и принудительный HTTPS ---
# Включать только на проде: в dev-окружении отправит все запросы на https://turkov.ru.
# Редирект http -> https для домена из SITE_DOMAIN уже делает Traefik (см. docker-compose.yml).
#if ($host ~* ^www\.) {
#    return 301 https://turkov.ru$request_uri;
#}
#if ($http_x_forwarded_proto != "https") {
#    return 301 https://turkov.ru$request_uri;
#}

# --- 3. Точные редиректы (бывшие "Redirect 301") ---
if ($htaccess_redirect) {
    return 301 $htaccess_redirect$htaccess_redirect_args;
}

# --- 4. Убираем index.php (только сам /index.php без параметров) ---
if ($request_uri = "/index.php") {
    return 301 /;
}

# --- 5. Редиректы по шаблону (бывшие "RewriteRule ... [R=301]") ---
# "?" в конце цели - не дописывать исходные аргументы запроса.

# UTM метки (короткие ссылки с пульта)
rewrite ^/np/?$ /catalog/optsii_i_raskhodnye_materialy/vozdushnye_nagrevateli/?utm_source=pult? permanent;
rewrite ^/cb/?$ /catalog/kanalnoe_oborudovanie/kanalnye_okhladiteli/?utm_source=pult? permanent;
rewrite ^/hb/?$ /catalog/kanalnoe_oborudovanie/adiabaticheskie_uvlazhniteli/?utm_source=pult? permanent;

# Разделы (info, news, projects, video, help и т.д.)
rewrite ^/info/technical/(.*)$  /blog/articles/$1 permanent;
rewrite ^/info/articles/(.*)$   /blog/articles/$1 permanent;
rewrite ^/info/articles1/(.*)$  /blog/articles/$1 permanent;
rewrite ^/info/technical1/(.*)$ /blog/articles/$1 permanent;
rewrite ^/news/(.*)$            /blog/news/$1 permanent;
rewrite ^/projects/(.*)$        /company/projects/$1 permanent;
rewrite ^/video/(.*)$           /blog/video/$1 permanent;
rewrite ^/help/payment/(.*)$    /clients/info/$1 permanent;
rewrite ^/help/delivery/(.*)$   /clients/info/$1 permanent;
rewrite ^/help/warranty/(.*)$   /clients/warranty/$1 permanent;
rewrite ^/help/service/(.*)$    /clients/service/$1 permanent;
rewrite ^/help/downloads/(.*)$  /clients/downloads/$1 permanent;
rewrite ^/info/faq/(.*)$        /clients/faq/$1 permanent;
rewrite ^/services/(.*)$        /clients/ permanent;
rewrite ^/automatics/(.*)$      /catalog/datchiki_i_kontrollery/ permanent;

# Каталог
rewrite ^/catalog/konditsionirovanie/(.*)$ /catalog/kanalnoe_oborudovanie/$1 permanent;
rewrite ^/catalog/pritochno_vytyazhnye_ustanovki_s_rekuperatsiey_tepla_i_vlagi/2_stupeni_rekuperatsii_do_25_c/(.*)$ /catalog/pritochno-vytyazhnaya-ventilyatsiya/pritochno-vytyazhnye-ustanovki/s-plastinchatym-rekuperatorom/2-stupeni-rekuperatsii-do-25-c/$1 permanent;
rewrite ^/catalog/pritochno_vytyazhnye_ustanovki_s_rekuperatsiey_tepla_i_vlagi/3_stupeni_rekuperatsii_do_35_c/(.*)$ /catalog/pritochno-vytyazhnaya-ventilyatsiya/pritochno-vytyazhnye-ustanovki/s-plastinchatym-rekuperatorom/3-stupeni-rekuperatsii-do-35-c/$1 permanent;
rewrite ^/catalog/pritochno_vytyazhnye_ustanovki_s_rekuperatsiey_tepla_i_vlagi/3_stupeni_rekuperatsii_do_35_c_co_vstroennym_okhladitelem/(.*)$ /catalog/pritochno-vytyazhnaya-ventilyatsiya/pritochno-vytyazhnye-ustanovki/s-plastinchatym-rekuperatorom/3-stupeni-rekuperatsii-do-35-c-co-vstroennym-okhladitelem/$1 permanent;
rewrite ^/catalog/pritochno_vytyazhnye_ustanovki_s_rekuperatsiey_tepla_i_vlagi/4_stupeni_rekuperatsii_do_45_c/(.*)$ /catalog/pritochno-vytyazhnaya-ventilyatsiya/pritochno-vytyazhnye-ustanovki/s-plastinchatym-rekuperatorom/4-stupeni-rekuperatsii-do-45-c/$1 permanent;
rewrite ^/catalog/optsii_i_raskhodnye_materialy/dlya_montazha_ventilyatsii/(.*)$ /catalog/optsii_i_raskhodnye_materialy/$1 permanent;
rewrite ^/catalog/kpd_70_pritochno_vytyazhnye_ustanovki_s_rekuperatsiey_tepla_i_vlagi_zenit/(.*)$ /catalog/pritochno-vytyazhnaya-ventilyatsiya/pritochno-vytyazhnye-ustanovki/ permanent;
rewrite ^/catalog/kpd_85_pritochno_vytyazhnye_ustanovki_s_rekuperatsiey_tepla_i_vlagi_zenit_heco/(.*)$ /catalog/pritochno-vytyazhnaya-ventilyatsiya/pritochno-vytyazhnye-ustanovki/ permanent;
rewrite ^/catalog/kpd_89_do_45_pritochno_vytyazhnye_ustanovki_s_rekuperatsiey_tepla_i_vlagi/(.*)$ /catalog/pritochno-vytyazhnaya-ventilyatsiya/pritochno-vytyazhnye-ustanovki/ permanent;

# Проекты / Отзывы
rewrite ^/company/projects/zenit-350-heco-e-v-dome-dom-160m(.*)$ /company/projects/ permanent;
rewrite ^/company/reviews/$ / permanent;

# Корневой Help (без исходных аргументов)
rewrite ^/help/$ /clients/info/? permanent;

# --- 6. Добавляем слеш, если его нет, это не файл/папка и в последнем сегменте нет точки ---
# /catalog/abc?x=1 -> /catalog/abc/?x=1
set $htaccess_slash "";
if (!-e $request_filename) {
    set $htaccess_slash $request_uri;
}
if ($htaccess_slash ~ "^([^?]*/[^/.?]+)(\?.*)?$") {
    return 301 $1/$2;
}
