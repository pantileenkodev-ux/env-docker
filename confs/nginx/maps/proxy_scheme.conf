#
# Схема, порт и признак HTTPS исходного запроса, пришедшего к реверс-прокси (Traefik).
# Без этих карт сайт за прокси, терминирующим TLS, считает запрос http-запросом
# и генерирует ссылки и редиректы на http, что дает цикл редиректов.
#
map $http_x_forwarded_proto $bx_https {
    default   "";
    https     on;
}

map $http_x_forwarded_proto $bx_scheme {
    default   $scheme;
    http      http;
    https     https;
}

map $http_x_forwarded_port $bx_server_port {
    default   $server_port;
    ~^\d+$    $http_x_forwarded_port;
}
