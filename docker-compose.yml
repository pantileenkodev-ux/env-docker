networks:
  dev:
    driver: bridge
    attachable: true
    internal: false
    ipam:
      driver: default
      config:
        - subnet: 10.10.10.0/24
  # Внешняя сеть Traefik. Создается один раз командой:
  #   docker network create proxy
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
volumes:
  redis_data:
    driver: local
  mysql_log_data:
    driver: local
  mysql_lib_data:
    driver: local
  bxtemp_data:
    driver: local
  msmtp_data:
    driver: local
  browscap_data:
    driver: local
  geoip2_data:
    driver: local
services:
  memcached:
    image: memcached:1.6.45-alpine
    container_name: dev_memcached
    restart: unless-stopped
    env_file:
      - .env
#    ports:
#      - "11211:11211"
    init: true
    cgroup: private
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nodev,nosuid
      - /var/tmp:noexec,nodev,nosuid
      - /dev/shm:noexec,nodev,nosuid
    networks:
      dev:
        aliases:
          - memcached
  redis:
    #image: redis:7.2.14-alpine
    #image: redis:7.4.9-alpine
    #image: redis:8.0.6-alpine
    image: redis:8.2.7-alpine
    #image: redis:8.4.4-alpine
    #image: redis:8.6.4-alpine
    #image: redis:8.8.0-alpine
    container_name: dev_redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    env_file:
      - .env
#    ports:
#      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./confs/redis/redis.conf:/usr/local/etc/redis/redis.conf
    init: true
    cgroup: private
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:noexec,nodev,nosuid
      - /var/tmp:noexec,nodev,nosuid
      - /dev/shm:noexec,nodev,nosuid
    networks:
      dev:
        aliases:
          - redis
  mysql:
    image: quay.io/bitrix24/percona-server:8.0.46-v1-rhel
    #image: quay.io/bitrix24/percona-server:8.4.10-v1-rhel
    container_name: dev_mysql
    restart: unless-stopped
    env_file:
      - .env
      - .env_sql
#    ports:
#      - "3306:3306"
#      - "33060:33060"
    volumes:
      - mysql_log_data:/var/log/mysql
      - mysql_lib_data:/var/lib/mysql
    init: true
    cgroup: private
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    cap_add:
      - SYS_NICE
    tmpfs:
      - /tmp:noexec,nodev,nosuid
      - /var/tmp:noexec,nodev,nosuid
      - /dev/shm:noexec,nodev,nosuid
    networks:
      dev:
        aliases:
          - mysql
  php:
    image: quay.io/bitrix24/php:8.2.32-fpm-v1-alpine
    #image: quay.io/bitrix24/php:8.3.32-fpm-v1-alpine
    #image: quay.io/bitrix24/php:8.4.23-fpm-v1-alpine
    #image: quay.io/bitrix24/php:8.5.8-fpm-v1-alpine
    container_name: dev_php
    restart: unless-stopped
    env_file:
      - .env
      - .env_php
#    ports:
#      - "9000:9000"
    volumes:
      - ./confs/php82/etc/:/usr/local/etc/
      #- ./confs/php83/etc/:/usr/local/etc/
      #- ./confs/php84/etc/:/usr/local/etc/
      #- ./confs/php85/etc/:/usr/local/etc/
      - ./www/:/opt/www/
      - bxtemp_data:/opt/.bx_temp/
      - msmtp_data:/opt/msmtp/
      - browscap_data:/opt/browscap/
      - geoip2_data:/opt/geoip2/
    init: true
    cgroup: private
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nodev,nosuid
      - /var/tmp:noexec,nodev,nosuid
      - /dev/shm:noexec,nodev,nosuid
    networks:
      dev:
        aliases:
          - php
    depends_on:
      - mysql
  nginx:
    image: quay.io/bitrix24/nginx:1.30.4-v1-alpine
    container_name: dev_nginx
    restart: unless-stopped
    env_file:
      - .env
    # Сайт публикуется через Traefik, порт на хост не пробрасывается.
    # Раскомментируйте для прямого доступа в обход Traefik (отладка):
#    ports:
#      - "8588:80"
    volumes:
      - ./confs/nginx/:/etc/nginx/
      - ./www/:/opt/www/
      - bxtemp_data:/opt/.bx_temp/
    init: true
    cgroup: private
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:noexec,nodev,nosuid
      - /var/tmp:noexec,nodev,nosuid
      - /dev/shm:noexec,nodev,nosuid
    networks:
      dev:
        aliases:
          - nginx
      proxy:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-proxy}"
      # HTTPS: основной роутер сайта
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-dev}.rule=Host(`${SITE_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-dev}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-dev}.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-dev}.loadbalancer.server.port=80"
      # HTTP: редирект на HTTPS
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-dev}-http.rule=Host(`${SITE_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-dev}-http.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-dev}-http.middlewares=${COMPOSE_PROJECT_NAME:-dev}-https"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-dev}-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${COMPOSE_PROJECT_NAME:-dev}-https.redirectscheme.permanent=true"
  sphinx:
    image: quay.io/bitrix24/sphinx:2.2.11-v2-alpine
    container_name: dev_sphinx
#    ports:
#      - "9306:9306"
#      - "9312:9312"
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./confs/sphinx/sphinx.conf:/opt/sphinx/conf/sphinx.conf
    init: true
    cgroup: private
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nodev,nosuid
      - /var/tmp:noexec,nodev,nosuid
      - /dev/shm:noexec,nodev,nosuid
    networks:
      dev:
        aliases:
          - sphinx
  cron:
    image: quay.io/bitrix24/php:8.2.32-fpm-v1-alpine
    #image: quay.io/bitrix24/php:8.3.32-fpm-v1-alpine
    #image: quay.io/bitrix24/php:8.4.23-fpm-v1-alpine
    #image: quay.io/bitrix24/php:8.5.8-fpm-v1-alpine
    container_name: dev_cron
    restart: unless-stopped
    command: crond -f -d 8
    user: root
    env_file:
      - .env
      - .env_php
#    ports:
#      - "9001:9000"
    volumes:
      - ./confs/php82/etc/:/usr/local/etc/
      #- ./confs/php83/etc/:/usr/local/etc/
      #- ./confs/php84/etc/:/usr/local/etc/
      #- ./confs/php85/etc/:/usr/local/etc/
      - ./www/:/opt/www/
      - bxtemp_data:/opt/.bx_temp/
      - msmtp_data:/opt/msmtp/
      - browscap_data:/opt/browscap/
      - geoip2_data:/opt/geoip2/
    init: true
    cgroup: private
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:noexec,nodev,nosuid
      - /var/tmp:noexec,nodev,nosuid
      - /dev/shm:noexec,nodev,nosuid
    networks:
      dev:
        aliases:
          - cron
    depends_on:
      - php
